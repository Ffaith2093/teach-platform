<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首次登录 · 修改密码 · PyLearn</title>
<style>
:root{
  --primary:#0EA5E9; --primary-hover:#0284C7; --primary-fg:#fff; --primary-subtle:#E0F2FE;
  --primary-muted:#BAE6FD;
  --accent:#14B8A6; --accent-subtle:#CCFBF1;
  --success:#10B981; --success-subtle:#D1FAE5;
  --warning:#F59E0B; --warning-subtle:#FEF3C7;
  --danger:#EF4444;  --danger-subtle:#FEE2E2;
  --bg:#fff; --surface:#F8FAFC; --card:#fff; --border:#E2E8F0;
  --fg:#0F172A; --muted:#64748B; --subtle:#94A3B8;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.18);
}
html.dark{
  --primary:#38BDF8; --primary-hover:#7DD3FC; --primary-fg:#0B1120; --primary-subtle:#0C334A;
  --accent:#2DD4BF; --accent-subtle:#0A3D38;
  --success:#34D399; --success-subtle:#063B2A;
  --warning:#FBBF24; --warning-subtle:#422D06;
  --danger:#F87171;  --danger-subtle:#451414;
  --bg:#0B1120; --surface:#0F172A; --card:#16202F; --border:#2A3548;
  --fg:#F1F5F9; --muted:#94A3B8; --subtle:#64748B;
  --shadow-md:0 4px 12px -2px rgba(0,0,0,.4);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--surface);color:var(--fg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
  min-height:100vh;display:flex;flex-direction:column}
.mono{font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace}
.num{font-variant-numeric:tabular-nums}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.pub-nav{height:56px;display:flex;align-items:center;padding:0 24px}
.pub-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.pub-logo .mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--primary),#38BDF8);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.pub-nav .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pub-nav .logout{padding:7px 14px;border-radius:8px;font-size:13px;color:var(--muted);transition:.18s}
.pub-nav .logout:hover{background:var(--border);color:var(--fg)}
.icon-btn{padding:7px;border-radius:8px;color:var(--muted);font-size:18px;display:flex;transition:.18s}
.icon-btn:hover{background:var(--border);color:var(--fg)}

.shell{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px;
  background:
    radial-gradient(ellipse 600px 400px at 50% 0%,color-mix(in srgb,var(--warning) 6%,transparent),transparent 70%),
    radial-gradient(ellipse 400px 300px at 100% 100%,color-mix(in srgb,var(--primary) 6%,transparent),transparent 70%),
    var(--surface)}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px}

/* 顶部引导卡 */
.guide{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;
  border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);
  background:var(--warning-subtle);border-radius:12px}
.guide .ic{width:36px;height:36px;border-radius:9px;background:color-mix(in srgb,var(--warning) 25%,var(--card));
  color:var(--warning);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.guide .t h3{font-size:14px;font-weight:600;color:var(--fg)}
.guide .t p{margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.55}
.guide .t p b{color:var(--fg)}

.brand{text-align:center;margin-bottom:2px}
.brand .mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#38BDF8);
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--primary) 40%,transparent)}
.brand h1{margin-top:14px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand p{margin-top:6px;font-size:13.5px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:var(--shadow-md)}

/* 用户信息条 */
.user-strip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);margin-bottom:20px}
.user-strip .avatar{width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),#38BDF8);
  color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-strip .info{flex:1;min-width:0}
.user-strip .info b{font-size:13.5px;font-weight:600}
.user-strip .info span{display:block;font-size:11.5px;color:var(--subtle);margin-top:2px}
.user-strip .tag{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--warning-subtle);color:var(--warning)}

/* 表单 */
.fm{display:flex;flex-direction:column;gap:18px}
.fm-field{display:flex;flex-direction:column;gap:6px}
.fm-field label{font-size:12.5px;font-weight:500;color:var(--fg);display:flex;align-items:center;gap:6px}
.fm-field label .req{color:var(--danger);font-weight:600}
.fm-input{position:relative}
.fm-input .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--subtle);font-size:16px;display:flex}
.fm-input input{width:100%;height:44px;padding:0 14px 0 42px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);font-size:14px;color:var(--fg);outline:none;transition:.18s;font-family:inherit}
.fm-input input::placeholder{color:var(--subtle)}
.fm-input input:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.fm-input.has-eye input{padding-right:42px}
.fm-input .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--subtle);font-size:16px;
  display:flex;padding:4px;border-radius:6px;transition:.18s;cursor:pointer}
.fm-input .eye:hover{color:var(--fg);background:var(--border)}

/* 错误态 */
.fm-field.has-err .fm-input input{border-color:var(--danger);background:color-mix(in srgb,var(--danger-subtle) 30%,var(--surface))}
.fm-field.has-err .hint{color:var(--danger);display:flex;align-items:center;gap:4px}

/* 强度计 */
.strength{margin-top:6px;display:flex;align-items:center;gap:10px}
.strength .bars{display:flex;gap:4px;flex:1}
.strength .bar{flex:1;height:5px;border-radius:999px;background:var(--border);transition:.25s}
.strength .bar.on-l{background:var(--danger)}
.strength .bar.on-m{background:var(--warning)}
.strength .bar.on-h{background:var(--success)}
.strength .lbl{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.strength .lbl.l-1{color:var(--danger)}
.strength .lbl.l-2{color:var(--warning)}
.strength .lbl.l-3{color:var(--accent)}
.strength .lbl.l-4{color:var(--success)}

/* 要求清单 */
.req-list{margin-top:8px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);display:flex;flex-direction:column;gap:7px}
.req-list .t{font-size:11.5px;color:var(--subtle);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.req{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);transition:.18s}
.req .ic{width:16px;height:16px;border-radius:50%;background:var(--border);color:transparent;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.18s}
.req.met{color:var(--fg)}
.req.met .ic{background:var(--success);color:#fff}
.req.met.fail{color:var(--danger)}
.req.met.fail .ic{background:var(--danger)}

.fm-row-end{display:flex;justify-content:flex-end;margin-top:-4px}
.fm-row-end a{font-size:12.5px;color:var(--primary);font-weight:500}
.fm-row-end a:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:11px;
  background:var(--primary);color:var(--primary-fg);font-size:15px;font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .18s,box-shadow .18s;width:100%}
.btn:hover{background:var(--primary-hover);box-shadow:var(--shadow-md)}
.btn svg{font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--border);color:var(--muted)}

.foot-note{text-align:center;font-size:12px;color:var(--subtle);line-height:1.7}

@media(max-width:520px){
  .card{padding:24px 22px;border-radius:14px}
  .wrap{max-width:100%}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .3s ease-out both}
.d1{animation-delay:.06s}
.d2{animation-delay:.12s}
.d3{animation-delay:.18s}
</style>
</head>
<body>

<svg style="display:none">
<symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9 12 4l10 5-10 5z"/><path d="M6 11v5c0 1 3 3 6 3s6-2 6-3v-5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M15 8l4 4"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m2 2 20 20"/><path d="M6.7 6.7C4 8.4 2 12 2 12s3 7 10 7c2 0 3.7-.5 5.2-1.3"/><path d="M9.9 5.1A10 10 0 0 1 22 12c-.6 1.4-1.6 3-3 4.2"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="m12 3 10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
</svg>

<header class="pub-nav">
  <a class="pub-logo" href="index.html">
    <div class="mark"><svg><use href="#i-cap"/></svg></div>
    <span>PyLearn</span>
  </a>
  <div class="right">
    <a class="logout" href="login.html"><svg><use href="#i-logout"/></svg>退出登录</a>
    <button class="icon-btn" id="theme-btn"><svg id="use-theme"><use href="#i-sun"/></svg></button>
  </div>
</header>

<main class="shell">
  <div class="wrap">

    <!-- 引导提示 -->
    <div class="guide anim">
      <div class="ic"><svg><use href="#i-warn"/></svg></div>
      <div class="t">
        <h3>为了你的账号安全，请先修改初始密码</h3>
        <p>初始密码由学校管理员下发，仅可使用一次。修改成功后你将自动进入工作台。</p>
      </div>
    </div>

    <form class="card anim d1" id="form" onsubmit="return onSubmit(event)">

      <div class="brand">
        <div class="mark"><svg><use href="#i-key"/></svg></div>
        <h1>修改密码</h1>
        <p>设置一个至少 8 位、含字母与数字的强密码</p>
      </div>

      <!-- 当前用户 -->
      <div class="user-strip">
        <div class="avatar">王</div>
        <div class="info">
          <b>王建国</b>
          <span>wang.jianguo@example.edu.cn · T0018 · 高一段</span>
        </div>
        <span class="tag">待改密</span>
      </div>

      <div class="fm">

        <div class="fm-field" id="f-cur">
          <label for="cur">当前密码 <span class="req">*</span></label>
          <div class="fm-input has-eye">
            <span class="lead"><svg><use href="#i-lock"/></svg></span>
            <input type="password" id="cur" placeholder="初始密码或上一次的密码" autocomplete="current-password" value="Init@2024Edu">
            <span class="eye" data-target="cur"><svg id="eye-cur"><use href="#i-eye"/></svg></span>
          </div>
        </div>

        <div class="fm-field" id="f-new">
          <label for="new">新密码 <span class="req">*</span></label>
          <div class="fm-input has-eye">
            <span class="lead"><svg><use href="#i-key"/></svg></span>
            <input type="password" id="new" placeholder="请设置新密码" autocomplete="new-password" value="PyLearn#2026!">
            <span class="eye" data-target="new"><svg id="eye-new"><use href="#i-eye"/></svg></span>
          </div>
          <!-- 强度计 -->
          <div class="strength">
            <div class="bars">
              <div class="bar" id="sb1"></div>
              <div class="bar" id="sb2"></div>
              <div class="bar" id="sb3"></div>
              <div class="bar" id="sb4"></div>
            </div>
            <span class="lbl" id="s-lbl">—</span>
          </div>
          <!-- 规则清单 -->
          <div class="req-list">
            <div class="t">密码要求</div>
            <div class="req" id="r-len"><span class="ic"><svg><use href="#i-check"/></svg></span>至少 8 位字符</div>
            <div class="req" id="r-letter"><span class="ic"><svg><use href="#i-check"/></svg></span>包含字母（区分大小写更佳）</div>
            <div class="req" id="r-digit"><span class="ic"><svg><use href="#i-check"/></svg></span>包含数字</div>
            <div class="req" id="r-symbol"><span class="ic"><svg><use href="#i-check"/></svg></span>包含符号（推荐）</div>
          </div>
        </div>

        <div class="fm-field" id="f-conf">
          <label for="conf">确认新密码 <span class="req">*</span></label>
          <div class="fm-input has-eye">
            <span class="lead"><svg><use href="#i-key"/></svg></span>
            <input type="password" id="conf" placeholder="再次输入新密码" autocomplete="new-password" value="PyLearn#2026!">
            <span class="eye" data-target="conf"><svg id="eye-conf"><use href="#i-eye"/></svg></span>
          </div>
          <div class="hint" id="conf-hint" style="font-size:11.5px;color:var(--subtle);display:flex;align-items:center;gap:4px"></div>
        </div>

        <button type="submit" class="btn"><svg><use href="#i-arrow"/></svg>修改密码并进入工作台</button>

      </div>
    </form>

    <p class="foot-note anim d2">
      修改后 7 天内不再提示 · 修改记录会出现在账号审计日志中<br>
      如忘记当前密码，请<a href="#" onclick="toast('请联系系统管理员重置');return false" style="color:var(--primary);font-weight:500">联系管理员</a>
    </p>

  </div>
</main>

<script src="lib/admin-shared.js"></script>
<script>
(function(){
  var html = document.documentElement;
  if (localStorage.getItem('theme') === 'dark') {
    html.classList.add('dark');
    var u = document.getElementById('use-theme'); if (u) u.setAttribute('href', '#i-moon');
  }
  document.getElementById('theme-btn').addEventListener('click', function(){
    var d = html.classList.toggle('dark');
    document.getElementById('use-theme').setAttribute('href', d ? '#i-moon' : '#i-sun');
    localStorage.setItem('theme', d ? 'dark' : 'light');
  });

  // 显示密码
  document.querySelectorAll('.eye').forEach(function(e){
    e.addEventListener('click', function(){
      var id = e.dataset.target;
      var inp = document.getElementById(id);
      var on = inp.type === 'password';
      inp.type = on ? 'text' : 'password';
      document.getElementById('eye-' + id).setAttribute('href', on ? '#i-eye-off' : '#i-eye');
    });
  });
})();

/* 密码强度 */
function calcStrength(s){
  var score = 0;
  var checks = {
    len: s.length >= 8,
    letter: /[a-zA-Z]/.test(s),
    digit: /\d/.test(s),
    symbol: /[^a-zA-Z0-9]/.test(s)
  };
  if (checks.len) score++;
  if (checks.letter && checks.digit) score++;
  if (checks.symbol) score++;
  if (s.length >= 12 && checks.letter && checks.digit && checks.symbol) score++;
  return { score: score, checks: checks };
}

function renderStrength(){
  var s = document.getElementById('new').value;
  var r = calcStrength(s);
  var cls = ['','','on-l','on-m','on-h'];
  for (var i = 1; i <= 4; i++) {
    var b = document.getElementById('sb' + i);
    b.className = 'bar';
    if (i <= r.score && r.score >= 1) b.classList.add(cls[r.score]);
  }
  var lbls = ['—','弱','中','良','强'];
  var lcls = ['','l-1','l-2','l-3','l-4'];
  var lbl = document.getElementById('s-lbl');
  lbl.textContent = lbls[r.score];
  lbl.className = 'lbl ' + (lcls[r.score] || '');

  ['len','letter','digit','symbol'].forEach(function(k){
    var el = document.getElementById('r-' + k);
    if (r.checks[k]) { el.classList.add('met'); el.classList.remove('fail'); }
    else { el.classList.remove('met'); }
  });
}
document.getElementById('new').addEventListener('input', renderStrength);
renderStrength();

/* 确认密码提示 */
function checkConf(){
  var n = document.getElementById('new').value;
  var c = document.getElementById('conf').value;
  var hint = document.getElementById('conf-hint');
  var fld = document.getElementById('f-conf');
  if (!c) { hint.innerHTML = '请再次输入新密码'; fld.classList.remove('has-err'); return; }
  if (n !== c) {
    hint.innerHTML = '<svg style="color:var(--danger)"><use href="#i-warn"/></svg>两次输入的密码不一致';
    fld.classList.add('has-err');
  } else {
    hint.innerHTML = '<svg style="color:var(--success)"><use href="#i-check"/></svg>两次输入一致';
    fld.classList.remove('has-err');
  }
}
document.getElementById('conf').addEventListener('input', checkConf);
checkConf();

function onSubmit(e){
  e.preventDefault();
  var cur = document.getElementById('cur').value;
  var n = document.getElementById('new').value;
  var c = document.getElementById('conf').value;

  document.querySelectorAll('.fm-field').forEach(function(f){ f.classList.remove('has-err'); });

  if (!cur) {
    var f1 = document.getElementById('f-cur'); f1.classList.add('has-err');
    f1.querySelector('.hint') && (f1.querySelector('.hint').textContent = '请输入当前密码');
    return false;
  }
  if (!n) {
    var f2 = document.getElementById('f-new'); f2.classList.add('has-err');
    return false;
  }
  if (n.length < 8) {
    var f3 = document.getElementById('f-new'); f3.classList.add('has-err');
    var hint = document.createElement('div'); hint.className = 'hint';
    hint.textContent = '新密码至少 8 位'; f3.appendChild(hint);
    return false;
  }
  if (n === cur) {
    var f4 = document.getElementById('f-new'); f4.classList.add('has-err');
    var h2 = document.createElement('div'); h2.className = 'hint';
    h2.textContent = '新密码不能与当前密码相同'; f4.appendChild(h2);
    return false;
  }
  if (n !== c) {
    var f5 = document.getElementById('f-conf'); f5.classList.add('has-err');
    return false;
  }

  toast('密码修改成功，正在进入工作台…');
  setTimeout(function(){ window.location.href = 'teacher-dashboard.html'; }, 700);
  return false;
}
</script>

</body>
</html>
