name: pylearn

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  NODE_ENV: production
  HOME: /tmp
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://pylearn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}@postgres:5432/pylearn?schema=public"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env.production}@redis:6379"
  AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in deploy/.env.production}"
  NEXTAUTH_URL: "${NEXTAUTH_URL:?Set NEXTAUTH_URL in deploy/.env.production}"
  AUTH_TRUST_HOST: "true"
  CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in deploy/.env.production}"
  UPLOAD_DIR: /app/uploads
  MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-104857600}"
  JUDGE_BACKEND: docker
  JUDGE_IMAGE: "${JUDGE_IMAGE:-python:3.11-slim}"
  JUDGE_CONCURRENCY: "${JUDGE_CONCURRENCY:-4}"
  JUDGE_TOTAL_TIMEOUT_MS: "${JUDGE_TOTAL_TIMEOUT_MS:-30000}"
  JUDGE_TMP_DIR: "${JUDGE_TMP_DIR:?Set an absolute JUDGE_TMP_DIR in deploy/.env.production}"

x-app-common: &app-common
  image: "pylearn-app:${IMAGE_TAG:-latest}"
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  environment: *app-environment
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging: *default-logging
  networks:
    - app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pylearn
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}"
      POSTGRES_DB: pylearn
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pylearn -d pylearn"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env.production}"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      - app

  web:
    <<: *app-common
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
      - next-cache:/app/.next/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${JUDGE_TMP_DIR:?Set JUDGE_TMP_DIR}:${JUDGE_TMP_DIR:?Set JUDGE_TMP_DIR}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s

  worker:
    <<: *app-common
    group_add:
      - "${DOCKER_GID:-0}"
    command: ["./node_modules/.bin/tsx", "worker/index.ts"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${JUDGE_TMP_DIR:?Set JUDGE_TMP_DIR}:${JUDGE_TMP_DIR:?Set JUDGE_TMP_DIR}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s

  cron:
    <<: *app-common
    profiles: ["cron"]
    command: ["./node_modules/.bin/tsx", "worker/cron.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  next-cache:
