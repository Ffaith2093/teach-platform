# Python 教学平台 · 单机部署
# 首次运行先初始化数据库；不要对已有数据执行 down -v。

services:
  postgres:
    image: postgres:16-alpine
    container_name: pylearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pylearn
      POSTGRES_PASSWORD: pylearn_dev
      POSTGRES_DB: pylearn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pylearn -d pylearn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pylearn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pylearn:pylearn_dev@postgres:5432/pylearn?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      JUDGE_BACKEND: docker
      JUDGE_TMP_DIR: ${JUDGE_TMP_DIR:-/tmp/pylearn-judge}
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JUDGE_TMP_DIR:-/tmp/pylearn-judge}:${JUDGE_TMP_DIR:-/tmp/pylearn-judge}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["./node_modules/.bin/tsx", "worker/index.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pylearn:pylearn_dev@postgres:5432/pylearn?schema=public
      REDIS_URL: redis://redis:6379
      JUDGE_BACKEND: docker
      JUDGE_TMP_DIR: ${JUDGE_TMP_DIR:-/tmp/pylearn-judge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JUDGE_TMP_DIR:-/tmp/pylearn-judge}:${JUDGE_TMP_DIR:-/tmp/pylearn-judge}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    build: .
    command: ["./node_modules/.bin/tsx", "worker/cron.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pylearn:pylearn_dev@postgres:5432/pylearn?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4.8.1
    container_name: pylearn-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  uploads-data:
